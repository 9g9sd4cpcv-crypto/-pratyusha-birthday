<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Pratyusha ❤️</title>

<style>
body {
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:black;
  color:white;
  text-align:center;
  overflow:hidden;
}

/* canvas */
canvas {
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

/* glow */
.glow {
  color:#ff4b5c;
  text-shadow:0 0 20px #ff4b5c,0 0 40px #ff4b5c;
}

/* heartbeat */
@keyframes beat {
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.08);}
}
.heartbeat { animation:beat 1.2s infinite; }

/* screens */
.screen {
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  padding:20px;
}
.hidden { display:none; }

/* button */
button {
  background:#ff4b5c;
  border:none;
  padding:12px 20px;
  color:white;
  border-radius:25px;
  margin-top:20px;
}

/* reel */
.reel {
  position:relative;
  width:250px;
  height:400px;
  margin-top:20px;
  border-radius:20px;
  overflow:hidden;
}

.reel img {
  width:100%;
  height:100%;
  object-fit:cover;
  transition:opacity 0.8s ease;
}

.blur-bg {
  position:absolute;
  width:100%;
  height:100%;
  background-size:cover;
  filter:blur(25px) brightness(0.6);
  transform:scale(1.3);
}

.overlayText {
  position:absolute;
  bottom:20px;
  left:10px;
  right:10px;
  text-shadow:0 0 10px black;
  transition:opacity 0.8s ease;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<!-- INTRO -->
<div id="intro" class="screen">
  <h1 class="glow heartbeat">For Pratyusha ❤️</h1>
  <p>Use earphones and tap 💖</p>
  <button onclick="start()">Start</button>
</div>

<!-- MAIN -->
<div id="main" class="screen hidden">
  <h1 class="glow">Happy Birthday ❤️</h1>
  <p id="typeText"></p>

  <h2>❤️ Days Together</h2>
  <p id="daysCount"></p>

  <div id="photoSection" class="hidden">
    <h2 class="glow">The Reason I Smile ❤️</h2>

    <div class="reel">
      <img id="mainPhoto">
      <div class="blur-bg" id="blurBg"></div>
      <div class="overlayText" id="overlayText"></div>
    </div>
  </div>

  <button onclick="finalSurprise()">Final Surprise 🎁</button>
</div>

<!-- FINAL -->
<div id="endPage" class="screen hidden">
  <h1 id="finalName" class="glow heartbeat"></h1>
  <p id="finalText"></p>
  <h2 id="finalLine"></h2>
</div>

<audio id="music" loop>
  <source src="music/song.mp3" type="audio/mpeg">
</audio>

<script>
// START
function start(){
  intro.style.display="none";
  main.style.display="flex";
  music.play();
  typeWriter();
  updateDays();

  setTimeout(startSlideshow,2200);
}

// TYPE TEXT
let text="From the day we met... everything changed. You became my peace, my happiness, and my everything ❤️";
let i=0;
function typeWriter(){
  if(i<text.length){
    typeText.innerHTML+=text[i++];
    setTimeout(typeWriter,40);
  }
}

// DAYS
function updateDays(){
  let d=new Date("2023-12-17");
  let now=new Date();
  let days=Math.floor((now-d)/(1000*60*60*24));
  daysCount.innerHTML=days+" days of loving you ❤️";
}

// PHOTOS
let photos=["images/p1.jpg","images/p2.jpg","images/p3.jpg","images/p4.jpg"];
let captions=[
"The way you smile… it changes everything ❤️",
"You’re my favorite person ✨",
"With you… everything feels right 💖",
"Will you stay with me forever? ❤️"
];
let timings=[2.4,7.8,13.2,19.6];
let index=0;

function startSlideshow(){
  photoSection.style.display="block";
  music.ontimeupdate=()=>{
    if(index<timings.length && music.currentTime>=timings[index]){
      showSlide(index);
      index++;
    }
  }
}

function showSlide(i){
  mainPhoto.style.opacity=0;
  overlayText.style.opacity=0;

  setTimeout(()=>{
    mainPhoto.src=photos[i];
    blurBg.style.backgroundImage=`url(${photos[i]})`;
    overlayText.innerHTML=captions[i];

    mainPhoto.style.opacity=1;
    overlayText.style.opacity=1;
  },700);
}

// FINAL
function finalSurprise(){
  main.style.display="none";
  endPage.style.display="flex";
  fadeMusic();
  animateEnding();
}

// MUSIC FADE
function fadeMusic(){
  let v=music.volume;
  let f=setInterval(()=>{
    if(v>0.02){v-=0.02; music.volume=v;}
    else{music.volume=0; clearInterval(f);}
  },200);
}

// END TEXT
function animateEnding(){
  let name="Pratyusha ❤️";
  let msg="You came into my life unexpectedly... and became my favorite part of it. I’ll always choose you.";
  let line="Will you stay with me forever? ❤️";

  let a=0,b=0;

  function n(){
    if(a<name.length){
      finalName.innerHTML+=name[a++];
      setTimeout(n,120);
    } else t();
  }

  function t(){
    if(b<msg.length){
      finalText.innerHTML+=msg[b++];
      setTimeout(t,35);
    } else finalLine.innerHTML=line;
  }

  n();
}

// PARTICLES
let c=document.getElementById("bg"),ctx=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;
let p=[];
for(let i=0;i<80;i++){p.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*2});}
function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle="pink";
  p.forEach(e=>{
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
    ctx.fill();
    e.y-=0.3;if(e.y<0)e.y=c.height;
  });
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
