<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Pratyusha ❤️</title>

<style>
html { scroll-behavior:smooth; }
body {
  margin:0;
  font-family:'Segoe UI';
  background:black;
  color:white;
  text-align:center;
  overflow-x:hidden;
  overflow-y:auto;
}

canvas { position:fixed; top:0; left:0; z-index:-1; }

.glow { color:#ff4b5c; text-shadow:0 0 20px #ff4b5c,0 0 40px #ff4b5c; }

.screen {
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  padding:20px;
}

button {
  background:linear-gradient(45deg,#ff4b5c,#ff7a7a);
  border:none;
  padding:12px 25px;
  color:white;
  border-radius:30px;
  margin:10px;
}

.reel {
  width:260px;
  height:420px;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 0 25px #ff4b5c;
  position:relative;
}

.reel img {
  width:100%;
  height:100%;
  object-fit:cover;
  transition:0.8s;
}

.overlayText {
  position:absolute;
  bottom:20px;
  left:10px;
  right:10px;
  text-shadow:0 0 10px black;
}

#confettiCanvas {
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>
<canvas id="confettiCanvas"></canvas>

<!-- INTRO -->
<div id="intro" class="screen">
  <h1 class="glow">For Pratyusha ❤️</h1>
  <button onclick="start()">Start 💖</button>
</div>

<!-- MAIN -->
<div id="main" class="screen" style="display:none;">
  <h1 class="glow">Happy Birthday ❤️</h1>

  <p id="storyText" style="max-width:500px; line-height:1.6;"></p>

  <p id="daysCount"></p>

  <div id="photoSection" style="display:none;">
    <div class="reel">
      <img id="mainPhoto">
      <div class="overlayText" id="overlayText"></div>
    </div>
  </div>

  <button onclick="finalSurprise()">Final Surprise 🎁</button>
</div>

<!-- FINAL -->
<div id="endPage" class="screen" style="display:none;">
  <h1 class="glow">Pratyusha ❤️</h1>
  <p id="finalText"></p>
  <h2 id="finalLine"></h2>

  <button id="yesBtn" onclick="yesClicked()">Yes ❤️</button>
  <button id="noBtn" onclick="moveNo()">No 😏</button>

  <p id="responseText"></p>
</div>

<audio id="music" loop>
<source src="music/song.mp3">
</audio>

<script>

// STORY TEXT (EMOTIONAL)
let story = `From the day we met on 17th December 2023, everything slowly started changing in a way I never expected. 
At first, it was just normal… just two people meeting, talking… but then you became something much more than that.

You became my comfort. My peace. The one person I think about without even trying.

The way you smile, the way you talk, even the little things you love… like Kinder Joy 🍫, or how much you admire [Virat Kohli](chatgpt://generic-entity?number=2)… everything about you just feels special to me.

Sometimes I feel like our story is like one of those emotional scenes from [Arafat](chatgpt://generic-entity?number=3)… simple from outside, but so deep from inside.

I don’t know when exactly it happened… but somewhere between those normal conversations and small moments… you became my favorite part of every day.

And honestly… I don’t just like you.  
I care about you.  
I worry about you.  
And I want to stay with you… not just for now… but for a long time. ❤️`;

let i=0;
function typeStory(){
  if(i<story.length){
    document.getElementById("storyText").innerHTML += story[i++];
    setTimeout(typeStory,25);
  }
}

// START
function start(){
  intro.style.display="none";
  main.style.display="flex";
  music.play();
  typeStory();
  updateDays();
  setTimeout(startSlideshow,3000);
}

// DAYS
function updateDays(){
  let d=new Date("2023-12-17");
  let now=new Date();
  let days=Math.floor((now-d)/(1000*60*60*24));
  daysCount.innerHTML=days+" days ❤️";
}

// PHOTOS (YOUR LINKS)
let photos=[
"https://i.ibb.co/0yJPG7yd/tmpl7q15m-x.jpg",
"https://i.ibb.co/d0B7tvD6/tmp0h2pixqc.jpg",
"https://i.ibb.co/Ts0gd70/tmp91cz6bh8.jpg",
"https://i.ibb.co/ksXt8sGc/tmpxk8qu98s.jpg"
];

let captions=[
"The way you smile… ❤️",
"My favorite person ✨",
"Everything feels right with you 💖",
"Will you stay forever? ❤️"
];

let index=0;

function startSlideshow(){
  photoSection.style.display="block";
  showSlide();
}

function showSlide(){
  mainPhoto.src=photos[index];
  overlayText.innerHTML=captions[index];
  index=(index+1)%photos.length;
  setTimeout(showSlide,4000);
}

// FINAL
function finalSurprise(){
  main.style.display="none";
  endPage.style.display="flex";
  animateEnding();
}

function animateEnding(){
  finalText.innerHTML="You came into my life unexpectedly… and became my everything.";
  setTimeout(()=>{finalLine.innerHTML="Will you stay with me forever? ❤️";},1200);
}

// YES NO
function yesClicked(){
  responseText.innerHTML="I knew it ❤️ You just made me the happiest person alive.";
  yesBtn.style.display="none";
  noBtn.style.display="none";
  startConfetti();
}

function moveNo(){
  noBtn.style.transform=`translate(${Math.random()*200-100}px,${Math.random()*200-100}px)`;
}

// CONFETTI
let ctx=document.getElementById("confettiCanvas").getContext("2d");
let confetti=[];
function startConfetti(){
  for(let i=0;i<120;i++){
    confetti.push({x:innerWidth/2,y:innerHeight/2,dx:(Math.random()-0.5)*8,dy:(Math.random()-0.5)*8});
  }
  animateConfetti();
}

function animateConfetti(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  confetti.forEach(p=>{
    p.x+=p.dx;
    p.y+=p.dy;
    p.dy+=0.2;
    ctx.fillText("❤️",p.x,p.y);
  });
  requestAnimationFrame(animateConfetti);
}

// BG PARTICLES
let c=document.getElementById("bg"),cx=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;
let p=[];
for(let i=0;i<60;i++)p.push({x:Math.random()*c.width,y:Math.random()*c.height});
function draw(){
  cx.clearRect(0,0,c.width,c.height);
  cx.fillStyle="pink";
  p.forEach(e=>{
    cx.fillRect(e.x,e.y,2,2);
    e.y-=0.3;if(e.y<0)e.y=c.height;
  });
  requestAnimationFrame(draw);
}
draw();

</script>

</body>
</html>
