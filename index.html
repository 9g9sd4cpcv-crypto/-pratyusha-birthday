<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Pratyusha ❤️</title>

<style>
body { margin:0; font-family:'Segoe UI'; background:black; color:white; text-align:center; overflow:hidden; }

canvas { position:fixed; top:0; left:0; z-index:-1; }

.glow { color:#ff4b5c; text-shadow:0 0 20px #ff4b5c,0 0 40px #ff4b5c; }

@keyframes beat {0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.heartbeat { animation:beat 1.2s infinite; }

.screen { height:100vh; display:flex; justify-content:center; align-items:center; flex-direction:column; padding:20px; }
.hidden { display:none; }

button {
  background:linear-gradient(45deg,#ff4b5c,#ff7a7a);
  border:none;
  padding:12px 25px;
  color:white;
  border-radius:30px;
  margin:10px;
}

.reel {
  position:relative;
  width:260px;
  height:420px;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 0 20px #ff4b5c;
}

.reel img { width:100%; height:100%; object-fit:cover; transition:0.8s; }

.blur-bg {
  position:absolute; width:100%; height:100%;
  filter:blur(25px) brightness(0.6); transform:scale(1.3);
}

.overlayText {
  position:absolute; bottom:20px; left:10px; right:10px;
  text-shadow:0 0 10px black;
}

#finalLine { text-shadow:0 0 15px #ff4b5c; }

#noBtn { transition:0.3s; }

#confettiCanvas {
  position:fixed; top:0; left:0; width:100%; height:100%;
  pointer-events:none;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>
<canvas id="confettiCanvas"></canvas>

<div id="intro" class="screen">
  <h1 class="glow heartbeat">For Pratyusha ❤️</h1>
  <button onclick="start()">Start 💖</button>
</div>

<div id="main" class="screen hidden">
  <h1 class="glow">Happy Birthday ❤️</h1>
  <p id="typeText"></p>
  <p id="daysCount"></p>

  <div id="photoSection" class="hidden">
    <div class="reel">
      <img id="mainPhoto">
      <div class="blur-bg" id="blurBg"></div>
      <div class="overlayText" id="overlayText"></div>
    </div>
  </div>

  <button onclick="finalSurprise()">Final Surprise 🎁</button>
</div>

<div id="endPage" class="screen hidden">
  <h1 id="finalName" class="glow heartbeat"></h1>
  <p id="finalText"></p>
  <h2 id="finalLine"></h2>

  <button id="yesBtn" onclick="yesClicked()">Yes ❤️</button>
  <button id="noBtn" onclick="moveNo()">No 😏</button>

  <p id="responseText"></p>
</div>

<audio id="music" loop>
  <source src="music/song.mp3">
</audio>

<script>
// START
function start(){
  intro.style.display="none";
  main.style.display="flex";
  music.play();
  typeWriter();
  updateDays();
  setTimeout(startSlideshow,2200);
}

// TEXT
let text="From the day we met... everything changed ❤️";
let i=0;
function typeWriter(){
  if(i<text.length){
    typeText.innerHTML+=text[i++];
    setTimeout(typeWriter,40);
  }
}

// DAYS
function updateDays(){
  let d=new Date("2023-12-17");
  let now=new Date();
  let days=Math.floor((now-d)/(1000*60*60*24));
  daysCount.innerHTML=days+" days ❤️";
}

// PHOTOS (.jpeg)
let photos=["images/p1.jpeg","images/p2.jpeg","images/p3.jpeg","images/p4.jpeg"];
let captions=[
"You ❤️",
"My favorite ✨",
"Always you 💖",
"Stay forever? ❤️"
];
let timings=[2.4,7.8,13.2,19.6];
let index=0;

function startSlideshow(){
  photoSection.style.display="block";
  music.ontimeupdate=()=>{
    if(index<timings.length && music.currentTime>=timings[index]){
      showSlide(index);
      index++;
    }
  }
}

function showSlide(i){
  mainPhoto.style.opacity=0;
  setTimeout(()=>{
    mainPhoto.src=photos[i];
    blurBg.style.backgroundImage=`url(${photos[i]})`;
    overlayText.innerHTML=captions[i];
    mainPhoto.style.opacity=1;
  },700);
}

// FINAL
function finalSurprise(){
  main.style.display="none";
  endPage.style.display="flex";
  fadeMusic();
  animateEnding();
}

function fadeMusic(){
  let v=music.volume;
  let f=setInterval(()=>{
    if(v>0.02){v-=0.02; music.volume=v;}
    else clearInterval(f);
  },200);
}

function animateEnding(){
  let name="Pratyusha ❤️";
  let msg="You became my everything.";
  let line="Will you stay with me forever? ❤️";

  let a=0,b=0;

  function n(){
    if(a<name.length){
      finalName.innerHTML+=name[a++];
      setTimeout(n,120);
    } else t();
  }

  function t(){
    if(b<msg.length){
      finalText.innerHTML+=msg[b++];
      setTimeout(t,35);
    } else setTimeout(()=>{finalLine.innerHTML=line;},1000);
  }

  n();
}

// YES/NO
function yesClicked(){
  responseText.innerHTML="I knew it ❤️";
  yesBtn.style.display="none";
  noBtn.style.display="none";
  startConfetti();
}

function moveNo(){
  let x=Math.random()*200-100;
  let y=Math.random()*200-100;
  noBtn.style.transform=`translate(${x}px,${y}px)`;
}

// CONFETTI
let ctx=document.getElementById("confettiCanvas").getContext("2d");
let confetti=[];

function startConfetti(){
  for(let i=0;i<120;i++){
    confetti.push({
      x:window.innerWidth/2,
      y:window.innerHeight/2,
      dx:(Math.random()-0.5)*8,
      dy:(Math.random()-0.5)*8,
      g:0.2
    });
  }
  animateConfetti();
}

function animateConfetti(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  confetti.forEach(p=>{
    p.x+=p.dx;
    p.y+=p.dy;
    p.dy+=p.g;
    ctx.fillText("❤️",p.x,p.y);
  });
  requestAnimationFrame(animateConfetti);
}

// PARTICLES BG
let c=document.getElementById("bg"),cx=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;
let p=[];
for(let i=0;i<60;i++)p.push({x:Math.random()*c.width,y:Math.random()*c.height});
function draw(){
  cx.clearRect(0,0,c.width,c.height);
  cx.fillStyle="pink";
  p.forEach(e=>{cx.fillRect(e.x,e.y,2,2); e.y-=0.3; if(e.y<0)e.y=c.height;});
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
