<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Pratyusha ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Poppins',sans-serif;
  color:white;
  overflow:hidden;
}

/* animated background */
body::before{
  content:"";
  position:fixed;
  width:200%;
  height:200%;
  background:radial-gradient(circle,#ff4b5c22,#000);
  animation:bgMove 12s linear infinite;
}
@keyframes bgMove{
  0%{transform:translate(0,0)}
  50%{transform:translate(-20%,-20%)}
  100%{transform:translate(0,0)}
}

/* pages */
.page{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  padding:30px;
  opacity:0;
  transition:1s;
}
.active{opacity:1}

/* glass card */
.card{
  backdrop-filter:blur(15px);
  background:rgba(255,255,255,0.05);
  padding:25px;
  border-radius:20px;
  max-width:600px;
}

/* text */
.glow{
  color:#ff4b5c;
  text-shadow:0 0 20px #ff4b5c;
}

p{
  line-height:1.9;
  margin-top:15px;
  font-size:17px;
}

/* image */
.img{
  width:260px;
  border-radius:20px;
  margin:20px 0;
  box-shadow:0 0 25px #ff4b5c;
  transition:0.5s;
}

/* hint */
.hint{
  opacity:0.5;
  font-size:13px;
  margin-top:20px;
}

/* cake */
#cake{font-size:70px;cursor:pointer}

/* canvas */
canvas{
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
}
</style>
</head>

<body>

<canvas id="fx"></canvas>

<audio id="music">
<source src="music/song.mp3">
</audio>

<!-- PAGE 1 -->
<div class="page active" id="p1">
<div class="card">
<h1 class="glow">Happy Birthday ❤️</h1>
<p id="text1"></p>
</div>
<div class="hint">tap anywhere to continue</div>
</div>

<!-- PAGE 2 -->
<div class="page" id="p2">
<div class="card">
<img class="img" src="https://i.ibb.co/0yJPG7yd/tmpl7q15m-x.jpg">
<p id="text2"></p>
</div>
</div>

<!-- PAGE 3 -->
<div class="page" id="p3">
<div class="card">
<img class="img" src="https://i.ibb.co/d0B7tvD6/tmp0h2pixqc.jpg">
<p id="text3"></p>
</div>
</div>

<!-- PAGE 4 -->
<div class="page" id="p4">
<div class="card">
<img class="img" src="https://i.ibb.co/Ts0gd70/tmp91cz6bh8.jpg">
<p id="text4"></p>
</div>
</div>

<!-- PAGE 5 -->
<div class="page" id="p5">
<div class="card">
<img class="img" src="https://i.ibb.co/ksXt8sGc/tmpxk8qu98s.jpg">

<p id="text5"></p>

<h2 style="margin-top:20px;">Will you stay with me forever? ❤️</h2>

<button onclick="yes()">Yes ❤️</button>
<button onclick="moveNo()" id="noBtn">No 😏</button>

<div id="cake">🎂</div>
<p id="res"></p>

<p class="hint">Created by Your Idiot</p>
</div>
</div>

<script>

// TYPEWRITER TEXT
function type(id,text,speed=30){
  let i=0;
  function t(){
    if(i<text.length){
      document.getElementById(id).innerHTML+=text[i++];
      setTimeout(t,speed);
    }
  }
  t();
}

// TEXT CONTENT
type("text1",
"From the day we met on 17th December 2023, something quietly started changing inside me. At first it was just normal conversations… but slowly, you became the one person I look forward to every single day."
);

type("text2",
"There’s something about you that just feels different. The way you smile, the way you talk… even the little things you love like Kinder Joy 🍫 make me smile too."
);

type("text3",
"The way you admire Virat Kohli… that passion, that love… I see that same spark in you. And that’s something I truly admire."
);

type("text4",
"What we have feels simple… but real. And honestly, that’s what makes it special. Because even silence with you feels comfortable."
);

type("text5",
"I don’t just want to be part of your life for now… I want to stay. Because you became someone I never want to lose. ❤️"
);

// NAVIGATION
let current=1;

function next(){
  if(current<5){
    document.getElementById("p"+current).classList.remove("active");
    current++;
    document.getElementById("p"+current).classList.add("active");
  }
}

// tap + swipe
document.body.onclick=()=>{
  music.play();
  next();
};

let startY=0;
document.addEventListener("touchstart",e=>startY=e.touches[0].clientY);
document.addEventListener("touchend",e=>{
  if(startY-e.changedTouches[0].clientY>50) next();
});

// NO BUTTON
function moveNo(){
  noBtn.style.transform=`translate(${Math.random()*200-100}px,${Math.random()*200-100}px)`;
}

// YES + EFFECT
function yes(){
  res.innerHTML="You just made me the happiest ❤️";
  firework();
}

// CAKE
cake.onclick=()=>{
  cake.innerHTML="🍰";
  firework();
}

// FIREWORK
let c=document.getElementById("fx");
let ctx=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

let p=[];

function firework(){
  for(let i=0;i<120;i++){
    p.push({
      x:c.width/2,
      y:c.height/2,
      dx:(Math.random()-0.5)*8,
      dy:(Math.random()-0.5)*8
    });
  }
  anim();
}

function anim(){
  ctx.clearRect(0,0,c.width,c.height);
  p.forEach(e=>{
    e.x+=e.dx;
    e.y+=e.dy;
    e.dy+=0.2;
    ctx.fillText("❤️",e.x,e.y);
  });
  requestAnimationFrame(anim);
}
</script>

</body>
</html>
